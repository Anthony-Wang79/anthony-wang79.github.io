---
layout: compress
---

{% include base_path %}

<!doctype html>
<html lang="{{ page.lang | default: site.locale }}" class="no-js">
  <head>
   {% include head.html %}
   {% include head/custom.html %}
   <meta charset="utf-8">
   <meta name="viewport" content="width=device-width, initial-scale=1">

   <!-- Allow search engines to index the site -->
   <meta name="robots" content="index, follow">

   <!-- Basic information -->
   <meta name="description" content="{{ page.description | default: site.description | strip_html | strip_newlines | escape }}">
   <meta name="keywords" content="{{ page.keywords | default: 'Xintong Wang, Fudan University, insurance economics, health economics, household finance' | escape }}">
   <meta name="author" content="{% if page.lang == 'zh-CN' %}{{ site.author.name_zh | default: '王昕彤' }}{% else %}{{ site.author.name | escape }}{% endif %}">
   <meta http-equiv="Content-Language" content="{{ page.lang | default: site.locale }}">
  </head>

   <body>

    {% include browser-upgrade.html %}
    {% include masthead.html %}

    {{ content }}

    <div class="page__footer">
      <footer>
        {% include footer/custom.html %}
        {% include footer.html %}
      </footer>
    </div>

    {% include scripts.html %}

  </body>
</html>
